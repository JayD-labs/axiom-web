schema_version: 3
defaults:
  evidence_ttl_seconds:
    read: 300
    write: 60
    destructive: 0
    privileged: 0
  retry_policies:
    safe_read_retry:
      automatic_provider_fallback: true
      after_execution_started: true
      max_provider_fallbacks: 1
    no_blind_retry:
      automatic_provider_fallback: false
      after_execution_started: false
      require_no_effect_evidence_before_retry: true
    no_automatic_retry:
      automatic_provider_fallback: false
      after_execution_started: false
capabilities:
  mail.read:
    domain: mail
    action_class: READ
    permission: mail:read
    connectors:
    - outlook
    - gmail
    - axiom_bridge_imap
    preference_order:
    - outlook
    - gmail
    - axiom_bridge_imap
    runtimes:
    - chatgpt
    - hybrid
    - bridge
    verification:
      required: true
      method: tool_result
    retry_policy: safe_read_retry
    evidence_ttl_seconds: 300
  mail.search:
